services:
  lab:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - run-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
volumes:
  run-data:
